<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Learning Companion 顶层架构地图</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0e13;
      --surface: #111821;
      --surface-strong: #17212d;
      --surface-soft: #0f151d;
      --text: #edf3fb;
      --muted: #94a3b5;
      --faint: #647287;
      --line: #2a3746;
      --line-strong: #42536a;
      --blue: #78a9ff;
      --blue-soft: rgba(120, 169, 255, 0.12);
      --green: #68d9ae;
      --green-soft: rgba(104, 217, 174, 0.11);
      --amber: #f1bd70;
      --amber-soft: rgba(241, 189, 112, 0.11);
      --purple: #b89cff;
      --purple-soft: rgba(184, 156, 255, 0.11);
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.28);
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      background: var(--bg);
    }

    body {
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 12% -8%, rgba(74, 111, 190, 0.17), transparent 32%),
        radial-gradient(circle at 95% 4%, rgba(118, 87, 174, 0.11), transparent 28%),
        var(--bg);
    }

    button {
      font: inherit;
    }

    code {
      color: #c7d8ef;
      font-family: "Cascadia Code", "SFMono-Regular", Consolas, monospace;
      font-size: 0.9em;
      overflow-wrap: anywhere;
    }

    .page {
      width: min(1540px, 100%);
      margin: 0 auto;
      padding: 22px;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 16px;
    }

    .brand {
      min-width: 0;
    }

    .eyebrow {
      margin: 0 0 7px;
      color: var(--blue);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 8px;
      font-size: clamp(25px, 3vw, 38px);
      line-height: 1.16;
      letter-spacing: -0.035em;
    }

    .intro {
      max-width: 820px;
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .baseline {
      flex: 0 0 auto;
      padding: 9px 11px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--faint);
      background: rgba(17, 24, 33, 0.72);
      font-size: 10px;
      line-height: 1.55;
      text-align: right;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 46px;
      margin-bottom: 12px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: rgba(17, 24, 33, 0.82);
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.16);
    }

    .breadcrumbs {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 5px;
      min-width: 0;
    }

    .crumb {
      padding: 5px 7px;
      border: 0;
      border-radius: 7px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      font-size: 11px;
    }

    .crumb:hover,
    .crumb[aria-current="page"] {
      color: var(--text);
      background: rgba(255, 255, 255, 0.045);
    }

    .crumb-separator {
      color: var(--faint);
      font-size: 10px;
    }

    .toolbar-actions {
      display: flex;
      flex: 0 0 auto;
      gap: 7px;
    }

    .toolbar-button,
    .enter-button {
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.025);
      cursor: pointer;
      font-size: 11px;
    }

    .toolbar-button:hover,
    .enter-button:hover {
      border-color: var(--line-strong);
      color: var(--text);
    }

    .toolbar-button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .content {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
      gap: 14px;
      align-items: start;
    }

    .map-panel,
    .inspector {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: rgba(15, 21, 29, 0.9);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .map-header {
      padding: 19px 20px 15px;
      border-bottom: 1px solid var(--line);
    }

    .map-kicker {
      margin: 0 0 6px;
      color: var(--faint);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .map-title {
      margin-bottom: 6px;
      font-size: 19px;
      line-height: 1.3;
      letter-spacing: -0.02em;
    }

    .map-description {
      max-width: 900px;
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.65;
    }

    .diagram-wrap {
      padding: 14px;
    }

    .diagram-note {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 2px 11px;
      color: var(--faint);
      font-size: 10px;
      line-height: 1.5;
    }

    .status-legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px;
    }

    .status-legend span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .status-legend i {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--green);
    }

    .status-legend .partial {
      background: var(--amber);
    }

    .status-legend .planned {
      background: var(--purple);
    }

    .diagram {
      position: relative;
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      grid-auto-rows: 96px;
      gap: 14px;
      min-height: calc(var(--rows, 5) * 110px);
      padding: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.035);
      border-radius: 13px;
      background:
        linear-gradient(rgba(255, 255, 255, 0.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.018) 1px, transparent 1px),
        rgba(8, 12, 17, 0.55);
      background-size: 24px 24px;
    }

    .edge-layer {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }

    .edge-path {
      fill: none;
      stroke: #4b5d73;
      stroke-width: 1.5;
      marker-end: url(#arrow);
    }

    .edge-path.persist {
      stroke: #4da782;
      marker-end: url(#arrow-green);
    }

    .edge-path.contract {
      stroke: #8c77ca;
      stroke-dasharray: 5 5;
      marker-end: url(#arrow-purple);
    }

    .edge-path.both {
      marker-start: url(#arrow);
    }

    .edge-label rect {
      fill: #0d131b;
      stroke: #2b3848;
      stroke-width: 1;
      rx: 6;
    }

    .edge-label text {
      fill: #8fa0b5;
      font-size: 9px;
      font-weight: 600;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .node {
      position: relative;
      z-index: 2;
      display: grid;
      align-content: start;
      gap: 5px;
      min-width: 0;
      padding: 12px 13px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--text);
      background: linear-gradient(145deg, rgba(23, 33, 45, 0.98), rgba(16, 23, 32, 0.98));
      box-shadow: 0 12px 25px rgba(0, 0, 0, 0.18);
      cursor: pointer;
      text-align: left;
      transition:
        transform 150ms ease,
        border-color 150ms ease,
        background 150ms ease;
    }

    .node:hover {
      transform: translateY(-2px);
      border-color: var(--line-strong);
    }

    .node[aria-pressed="true"] {
      border-color: rgba(120, 169, 255, 0.68);
      background: linear-gradient(145deg, rgba(32, 48, 68, 0.98), rgba(18, 28, 39, 0.98));
      box-shadow:
        0 0 0 2px rgba(120, 169, 255, 0.12),
        0 14px 30px rgba(0, 0, 0, 0.23);
    }

    .node.boundary {
      align-content: center;
      border-style: dashed;
      color: #b9c6d7;
      background: rgba(13, 19, 27, 0.92);
      box-shadow: none;
    }

    .node.planned {
      border-color: rgba(184, 156, 255, 0.34);
      background: linear-gradient(145deg, rgba(40, 31, 57, 0.88), rgba(20, 20, 31, 0.96));
    }

    .node.partial {
      border-color: rgba(241, 189, 112, 0.32);
      background: linear-gradient(145deg, rgba(53, 41, 26, 0.82), rgba(25, 23, 21, 0.96));
    }

    .node-topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
    }

    .node-tag {
      min-width: 0;
      overflow: hidden;
      color: var(--faint);
      font-size: 8px;
      font-weight: 800;
      letter-spacing: 0.09em;
      text-overflow: ellipsis;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .node-status {
      flex: 0 0 auto;
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--green);
      box-shadow: 0 0 0 3px var(--green-soft);
    }

    .node.partial .node-status {
      background: var(--amber);
      box-shadow: 0 0 0 3px var(--amber-soft);
    }

    .node.planned .node-status {
      background: var(--purple);
      box-shadow: 0 0 0 3px var(--purple-soft);
    }

    .node-title {
      min-width: 0;
      overflow: hidden;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .node-caption {
      display: -webkit-box;
      overflow: hidden;
      color: var(--muted);
      font-size: 9px;
      line-height: 1.45;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .node-enter {
      position: absolute;
      right: 9px;
      bottom: 7px;
      color: var(--blue);
      font-size: 12px;
      font-weight: 700;
    }

    .inspector {
      position: sticky;
      top: 14px;
      overflow: hidden;
    }

    .inspector-content {
      padding: 19px;
    }

    .inspector-status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 12px;
      padding: 5px 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.025);
      font-size: 9px;
      font-weight: 700;
    }

    .inspector-status i {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--green);
    }

    .inspector-status.partial i {
      background: var(--amber);
    }

    .inspector-status.planned i {
      background: var(--purple);
    }

    .inspector h3 {
      margin-bottom: 8px;
      font-size: 18px;
      line-height: 1.3;
      letter-spacing: -0.02em;
    }

    .inspector-summary {
      margin-bottom: 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.7;
    }

    .detail-section {
      margin-top: 17px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }

    .detail-section h4 {
      margin: 0 0 8px;
      color: var(--faint);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }

    .detail-section ul {
      display: grid;
      gap: 6px;
      margin: 0;
      padding-left: 17px;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.55;
    }

    .detail-section li::marker {
      color: var(--faint);
    }

    .key-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .key-chip {
      padding: 5px 7px;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: #bed0e7;
      background: rgba(255, 255, 255, 0.025);
      font-family: "Cascadia Code", "SFMono-Regular", Consolas, monospace;
      font-size: 9px;
    }

    .source-list {
      display: grid;
      gap: 6px;
    }

    .source-list code {
      display: block;
      padding: 6px 7px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.022);
      font-size: 9px;
      line-height: 1.45;
    }

    .enter-button {
      width: 100%;
      margin-top: 18px;
      border-color: rgba(120, 169, 255, 0.34);
      color: #dce9ff;
      background: var(--blue-soft);
      font-weight: 700;
    }

    .footer-note {
      margin: 13px 2px 0;
      color: var(--faint);
      font-size: 10px;
      line-height: 1.6;
    }

    @media (max-width: 1060px) {
      .content {
        grid-template-columns: 1fr;
      }

      .inspector {
        position: static;
      }
    }

    @media (max-width: 720px) {
      .page {
        padding: 10px;
      }

      .topbar {
        display: grid;
      }

      .baseline {
        justify-self: start;
        text-align: left;
      }

      .toolbar {
        align-items: flex-start;
      }

      .diagram-note {
        display: grid;
      }

      .status-legend {
        justify-content: flex-start;
      }

      .diagram {
        display: block;
        min-height: 0 !important;
      }

      .edge-layer {
        display: none;
      }

      .node {
        width: 100%;
        min-height: 82px;
        margin-bottom: 10px;
      }

      .node:last-child {
        margin-bottom: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .node {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand">
        <p class="eyebrow">Learning Companion · Top-down architecture</p>
        <h1>先抓主线，再下钻实现</h1>
        <p class="intro">
          第一层只看 Electron 的信任边界；进入模块后才展示它自己的协作关系。
          跨模块调用只连到当前视图边缘，避免把整棵依赖树一次铺开。
        </p>
      </div>
      <div class="baseline">
        源码核对：2026-08-09<br>
        main 基线：984756d
      </div>
    </header>

    <nav class="toolbar" aria-label="架构层级导航">
      <div id="breadcrumbs" class="breadcrumbs"></div>
      <div class="toolbar-actions">
        <button id="backButton" class="toolbar-button" type="button">← 返回</button>
        <button id="homeButton" class="toolbar-button" type="button">总览</button>
      </div>
    </nav>

    <main class="content">
      <section class="map-panel" aria-labelledby="mapTitle">
        <header class="map-header">
          <p id="mapKicker" class="map-kicker"></p>
          <h2 id="mapTitle" class="map-title"></h2>
          <p id="mapDescription" class="map-description"></p>
        </header>
        <div class="diagram-wrap">
          <div class="diagram-note">
            <span>单击节点查看说明；双击节点，或使用右侧按钮进入下一层。</span>
            <span class="status-legend" aria-label="实现状态">
              <span><i></i>已实现</span>
              <span><i class="partial"></i>接口已就绪</span>
              <span><i class="planned"></i>规划中</span>
            </span>
          </div>
          <div id="diagram" class="diagram">
            <svg id="edgeLayer" class="edge-layer" aria-hidden="true">
              <defs>
                <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                  <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5d73"></path>
                </marker>
                <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                  <path d="M 0 0 L 10 5 L 0 10 z" fill="#4da782"></path>
                </marker>
                <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                  <path d="M 0 0 L 10 5 L 0 10 z" fill="#8c77ca"></path>
                </marker>
              </defs>
              <g id="edgePaths"></g>
              <g id="edgeLabels"></g>
            </svg>
            <div id="nodeLayer" style="display: contents"></div>
          </div>
        </div>
      </section>

      <aside class="inspector" aria-live="polite">
        <div id="inspectorContent" class="inspector-content"></div>
      </aside>
    </main>

    <p class="footer-note">
      图只描述当前主干代码和已经明确的扩展方向。状态为“规划中”的节点不是现有 API，
      接入第二种同类能力前应先把该统一入口实现出来。
    </p>
  </div>

  <script>
    (function () {
      "use strict";

      var statusLabels = {
        implemented: "已实现",
        partial: "接口已就绪，后端未完整落地",
        planned: "规划中"
      };

      function N(id, title, input) {
        return Object.assign({
          id: id,
          title: title,
          tag: "",
          caption: "",
          summary: "",
          status: "implemented",
          responsibilities: [],
          boundaries: [],
          keys: [],
          files: [],
          col: 1,
          row: 1,
          span: 3,
          rowSpan: 1,
          kind: "module"
        }, input || {});
      }

      var views = {
        overview: {
          title: "Electron 顶层边界",
          kicker: "LEVEL 1 · SYSTEM",
          description: "四个节点就是第一眼需要记住的全部：React 负责界面，Preload 负责白名单桥接，Electron Main 负责可信行为，Shared 负责三端共同理解的数据契约。",
          rows: 5,
          nodes: [
            N("react", "React Renderer", {
              tag: "UI PROCESS",
              caption: "页面、选择、临时状态、Workbench View",
              summary: "不可信 UI 层。只通过 window.learningCompanion 请求 Main，不直接访问 Node、SQLite、凭证或子进程。",
              responsibilities: ["组合 Home、ProjectPage、Settings 和 Generation UI。", "承载 Renderer Workbench Registry 与当前 Workbench View。"],
              boundaries: ["业务写入和文件访问必须越过 Preload。"],
              files: ["src/renderer/App.tsx", "src/renderer/project/ProjectPage.tsx"],
              child: "renderer",
              col: 1,
              row: 2,
              span: 3
            }),
            N("preload", "Preload / IPC Bridge", {
              tag: "TRUST BRIDGE",
              caption: "window.learningCompanion · invoke · events",
              summary: "唯一的 Renderer → Main 调用面。它只暴露类型化白名单方法，并把 IPC 成功或错误转换成统一结果。",
              responsibilities: ["封装 ipcRenderer.invoke。", "订阅 Asset、Generation、Provider、External Library 与 Workbench Facility 事件。"],
              boundaries: ["不保存领域状态，不决定 Workbench，不实现业务规则。"],
              files: ["src/preload/index.ts", "src/shared/ipc.ts"],
              child: "preload",
              col: 5,
              row: 2,
              span: 3
            }),
            N("main", "Electron Main", {
              tag: "TRUSTED PROCESS",
              caption: "ApplicationRuntime · Services · Database · Files",
              summary: "可信应用层。组合并持有 Project、Asset、Workbench、Generation、Provider、外部组件和持久化能力。",
              responsibilities: ["校验请求并执行领域行为。", "集中创建、注册和释放应用对象。"],
              boundaries: ["Renderer 不应自行 new 这里的 Service。"],
              files: ["src/main/bootstrap/create-application-runtime.ts", "src/main/bootstrap/application-runtime.ts"],
              child: "main",
              col: 9,
              row: 2,
              span: 3
            }),
            N("shared", "Shared Contracts", {
              tag: "PURE DATA",
              caption: "DTO · Manifest · Asset · Workbench · Generation",
              summary: "三端共同使用的纯数据和运行时校验。它让 IPC 两侧、Main/Renderer Workbench 以及生成入口使用同一套稳定标识。",
              responsibilities: ["定义可序列化数据。", "提供 is/clone/create 等边界校验。"],
              boundaries: ["不包含 React、Electron、SQLite 或文件系统行为。"],
              files: ["src/shared/", "src/shared/workbench/"],
              child: "shared",
              col: 4,
              row: 4,
              span: 6
            })
          ],
          edges: [
            { from: "react", to: "preload", label: "白名单调用", tone: "both" },
            { from: "preload", to: "main", label: "IPC 请求 / 事件", tone: "both" },
            { from: "shared", to: "react", label: "DTO / View types", tone: "contract" },
            { from: "shared", to: "preload", label: "API contract", tone: "contract" },
            { from: "shared", to: "main", label: "边界校验", tone: "contract" }
          ]
        },

        renderer: {
          parent: "overview",
          title: "React Renderer 的五块界面职责",
          kicker: "LEVEL 2 · RENDERER",
          description: "Renderer 只组织界面和输入。需要可信能力的模块把请求送到右侧 Preload 边界；具体媒体逻辑留在平铺的 Workbench feature 中。",
          rows: 6,
          nodes: [

      var state = {
        viewId: views[location.hash.slice(1)] ? location.hash.slice(1) : "overview",
        selectedId: null
      };

      var diagram = document.getElementById("diagram");
      var nodeLayer = document.getElementById("nodeLayer");
      var edgeLayer = document.getElementById("edgeLayer");
      var edgePaths = document.getElementById("edgePaths");
      var edgeLabels = document.getElementById("edgeLabels");
      var inspectorContent = document.getElementById("inspectorContent");
      var breadcrumbs = document.getElementById("breadcrumbs");
      var backButton = document.getElementById("backButton");
      var homeButton = document.getElementById("homeButton");
      var mapTitle = document.getElementById("mapTitle");
      var mapKicker = document.getElementById("mapKicker");
      var mapDescription = document.getElementById("mapDescription");
      var edgeFrame = 0;

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function canonicalTrail(viewId) {
        var trail = [];
        var current = viewId;
        var guard = new Set();

        while (views[current] && !guard.has(current)) {
          guard.add(current);
          trail.unshift(current);
          current = views[current].parent;
        }

        if (trail[0] !== "overview") {
          trail.unshift("overview");
        }
        return trail;
      }

      function navigate(viewId) {
        if (!views[viewId]) {
          return;
        }
        state.viewId = viewId;
        state.selectedId = null;
        history.replaceState(null, "", "#" + viewId);
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function renderBreadcrumbs() {
        var trail = canonicalTrail(state.viewId);
        breadcrumbs.innerHTML = "";

        trail.forEach(function (viewId, index) {
          if (index > 0) {
            var separator = document.createElement("span");
            separator.className = "crumb-separator";
            separator.textContent = "›";
            breadcrumbs.appendChild(separator);
          }

          var button = document.createElement("button");
          button.type = "button";
          button.className = "crumb";
          button.textContent = views[viewId].title;
          if (viewId === state.viewId) {
            button.setAttribute("aria-current", "page");
          } else {
            button.addEventListener("click", function () {
              navigate(viewId);
            });
          }
          breadcrumbs.appendChild(button);
        });

        backButton.disabled = state.viewId === "overview";
      }

      function renderNodes(view) {
        nodeLayer.innerHTML = "";
        var selectedExists = view.nodes.some(function (node) {
          return node.id === state.selectedId;
        });
        if (!selectedExists) {
          state.selectedId = view.nodes[0] ? view.nodes[0].id : null;
        }

        view.nodes.forEach(function (node) {
          var button = document.createElement("button");
          button.type = "button";
          button.id = "node-" + node.id;
          button.className = "node " + node.status + (node.kind === "boundary" ? " boundary" : "");
          button.style.gridColumn = node.col + " / span " + node.span;
          button.style.gridRow = node.row + " / span " + node.rowSpan;
          button.setAttribute("aria-pressed", node.id === state.selectedId ? "true" : "false");
          button.innerHTML =
            '<span class="node-topline">' +
              '<span class="node-tag">' + escapeHtml(node.tag) + '</span>' +
              '<span class="node-status" aria-hidden="true"></span>' +
            '</span>' +
            '<span class="node-title">' + escapeHtml(node.title) + '</span>' +
            '<span class="node-caption">' + escapeHtml(node.caption) + '</span>' +
            (node.child || node.target ? '<span class="node-enter" aria-hidden="true">↘</span>' : "");

          button.addEventListener("click", function () {
            state.selectedId = node.id;
            renderSelection(view);
          });
          button.addEventListener("dblclick", function () {
            if (node.child || node.target) {
              navigate(node.child || node.target);
            }
          });
          nodeLayer.appendChild(button);
        });
      }

      function renderSelection(view) {
        var node = view.nodes.find(function (candidate) {
          return candidate.id === state.selectedId;
        }) || view.nodes[0];

        Array.prototype.forEach.call(nodeLayer.querySelectorAll(".node"), function (button) {
          button.setAttribute("aria-pressed", button.id === "node-" + node.id ? "true" : "false");
        });

        var sections = "";

        if (node.responsibilities.length) {
          sections +=
            '<section class="detail-section"><h4>负责什么</h4><ul>' +
            node.responsibilities.map(function (item) {
              return "<li>" + escapeHtml(item) + "</li>";
            }).join("") +
            "</ul></section>";
        }

        if (node.boundaries.length) {
          sections +=
            '<section class="detail-section"><h4>不要放进这里</h4><ul>' +
            node.boundaries.map(function (item) {
              return "<li>" + escapeHtml(item) + "</li>";
            }).join("") +
            "</ul></section>";
        }

        if (node.keys.length) {
          sections +=
            '<section class="detail-section"><h4>关键键 / 契约</h4><div class="key-list">' +
            node.keys.map(function (item) {
              return '<span class="key-chip">' + escapeHtml(item) + "</span>";
            }).join("") +
            "</div></section>";
        }

        if (node.files.length) {
          sections +=
            '<section class="detail-section"><h4>源码入口</h4><div class="source-list">' +
            node.files.map(function (item) {
              return "<code>" + escapeHtml(item) + "</code>";
            }).join("") +
            "</div></section>";
        }

        var destination = node.child || node.target;
        var buttonLabel = node.child ? "进入该模块 →" : "打开相关模块 →";
        inspectorContent.innerHTML =
          '<div class="inspector-status ' + node.status + '"><i></i>' +
            escapeHtml(statusLabels[node.status]) +
          "</div>" +
          "<h3>" + escapeHtml(node.title) + "</h3>" +
          '<p class="inspector-summary">' + escapeHtml(node.summary || node.caption) + "</p>" +
          sections +
          (destination
            ? '<button id="enterButton" class="enter-button" type="button">' + buttonLabel + "</button>"
            : "");

        if (destination) {
          document.getElementById("enterButton").addEventListener("click", function () {
            navigate(destination);
          });
        }
      }

      function anchorFor(element, other, bounds) {
        var box = element.getBoundingClientRect();
        var otherBox = other.getBoundingClientRect();
        var centerX = box.left - bounds.left + box.width / 2;
        var centerY = box.top - bounds.top + box.height / 2;
        var otherX = otherBox.left - bounds.left + otherBox.width / 2;
        var otherY = otherBox.top - bounds.top + otherBox.height / 2;
        var dx = otherX - centerX;
        var dy = otherY - centerY;

        if (Math.abs(dx) >= Math.abs(dy)) {
          return {
            x: dx >= 0 ? box.right - bounds.left : box.left - bounds.left,
            y: centerY,
            side: "horizontal"
          };
        }

        return {
          x: centerX,
          y: dy >= 0 ? box.bottom - bounds.top : box.top - bounds.top,
          side: "vertical"
        };
      }

      function pathBetween(start, end) {
        if (start.side === "horizontal" || end.side === "horizontal") {
          var middleX = (start.x + end.x) / 2;
          return "M " + start.x + " " + start.y +
            " C " + middleX + " " + start.y +
            ", " + middleX + " " + end.y +
            ", " + end.x + " " + end.y;
        }

        var middleY = (start.y + end.y) / 2;
        return "M " + start.x + " " + start.y +
          " C " + start.x + " " + middleY +
          ", " + end.x + " " + middleY +
          ", " + end.x + " " + end.y;
      }

      function drawEdges() {
        cancelAnimationFrame(edgeFrame);
        edgeFrame = requestAnimationFrame(function () {
          var view = views[state.viewId];
          var bounds = diagram.getBoundingClientRect();
          var namespace = "http://www.w3.org/2000/svg";
          edgeLayer.setAttribute("viewBox", "0 0 " + bounds.width + " " + bounds.height);
          edgePaths.innerHTML = "";
          edgeLabels.innerHTML = "";

          view.edges.forEach(function (edge) {
            var from = document.getElementById("node-" + edge.from);
            var to = document.getElementById("node-" + edge.to);
            if (!from || !to) {
              return;
            }

            var start = anchorFor(from, to, bounds);
            var end = anchorFor(to, from, bounds);
            var path = document.createElementNS(namespace, "path");
            path.setAttribute("d", pathBetween(start, end));
            path.setAttribute("class", "edge-path " + (edge.tone || ""));
            edgePaths.appendChild(path);

            if (!edge.label) {
              return;
            }

            var group = document.createElementNS(namespace, "g");
            group.setAttribute("class", "edge-label");
            var text = document.createElementNS(namespace, "text");
            var x = (start.x + end.x) / 2;
            var y = (start.y + end.y) / 2;
            text.setAttribute("x", x);
            text.setAttribute("y", y);
            text.textContent = edge.label;
            group.appendChild(text);
            edgeLabels.appendChild(group);
            var box = text.getBBox();
            var rect = document.createElementNS(namespace, "rect");
            rect.setAttribute("x", box.x - 6);
            rect.setAttribute("y", box.y - 3);
            rect.setAttribute("width", box.width + 12);
            rect.setAttribute("height", box.height + 6);
            group.insertBefore(rect, text);
          });
        });
      }

      function render() {
        var view = views[state.viewId];
        mapTitle.textContent = view.title;
        mapKicker.textContent = view.kicker;
        mapDescription.textContent = view.description;
        diagram.style.setProperty("--rows", String(view.rows));
        renderBreadcrumbs();
        renderNodes(view);
        renderSelection(view);
        drawEdges();
      }

      backButton.addEventListener("click", function () {
        var parent = views[state.viewId].parent;
        if (parent) {
          navigate(parent);
        }
      });

      homeButton.addEventListener("click", function () {
        navigate("overview");
      });

      window.addEventListener("resize", drawEdges);
      window.addEventListener("hashchange", function () {
        var requested = location.hash.slice(1);
        if (views[requested] && requested !== state.viewId) {
          state.viewId = requested;
          state.selectedId = null;
          render();
        }
      });

      if ("ResizeObserver" in window) {
        new ResizeObserver(drawEdges).observe(diagram);
      }

      render();
    })();
  </script>
