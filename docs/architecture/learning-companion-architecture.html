<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Learning Companion 顶层架构地图</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0e13;
      --surface: #111821;
      --surface-strong: #17212d;
      --surface-soft: #0f151d;
      --text: #edf3fb;
      --muted: #94a3b5;
      --faint: #647287;
      --line: #2a3746;
      --line-strong: #42536a;
      --blue: #78a9ff;
      --blue-soft: rgba(120, 169, 255, 0.12);
      --green: #68d9ae;
      --green-soft: rgba(104, 217, 174, 0.11);
      --amber: #f1bd70;
      --amber-soft: rgba(241, 189, 112, 0.11);
      --purple: #b89cff;
      --purple-soft: rgba(184, 156, 255, 0.11);
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.28);
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      background: var(--bg);
    }

    body {
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 12% -8%, rgba(74, 111, 190, 0.17), transparent 32%),
        radial-gradient(circle at 95% 4%, rgba(118, 87, 174, 0.11), transparent 28%),
        var(--bg);
    }

    button {
      font: inherit;
    }

    code {
      color: #c7d8ef;
      font-family: "Cascadia Code", "SFMono-Regular", Consolas, monospace;
      font-size: 0.9em;
      overflow-wrap: anywhere;
    }

    .page {
      width: min(1540px, 100%);
      margin: 0 auto;
      padding: 22px;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 16px;
    }

    .brand {
      min-width: 0;
    }

    .eyebrow {
      margin: 0 0 7px;
      color: var(--blue);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 8px;
      font-size: clamp(25px, 3vw, 38px);
      line-height: 1.16;
      letter-spacing: -0.035em;
    }

    .intro {
      max-width: 820px;
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .baseline {
      flex: 0 0 auto;
      padding: 9px 11px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--faint);
      background: rgba(17, 24, 33, 0.72);
      font-size: 10px;
      line-height: 1.55;
      text-align: right;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 46px;
      margin-bottom: 12px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: rgba(17, 24, 33, 0.82);
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.16);
    }

    .breadcrumbs {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 5px;
      min-width: 0;
    }

    .crumb {
      padding: 5px 7px;
      border: 0;
      border-radius: 7px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      font-size: 11px;
    }

    .crumb:hover,
    .crumb[aria-current="page"] {
      color: var(--text);
      background: rgba(255, 255, 255, 0.045);
    }

    .crumb-separator {
      color: var(--faint);
      font-size: 10px;
    }

    .toolbar-actions {
      display: flex;
      flex: 0 0 auto;
      gap: 7px;
    }

    .toolbar-button,
    .enter-button {
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.025);
      cursor: pointer;
      font-size: 11px;
    }

    .toolbar-button:hover,
    .enter-button:hover {
      border-color: var(--line-strong);
      color: var(--text);
    }

    .toolbar-button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .content {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
      gap: 14px;
      align-items: start;
    }

    .map-panel,
    .inspector {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: rgba(15, 21, 29, 0.9);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .map-header {
      padding: 19px 20px 15px;
      border-bottom: 1px solid var(--line);
    }

    .map-kicker {
      margin: 0 0 6px;
      color: var(--faint);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .map-title {
      margin-bottom: 6px;
      font-size: 19px;
      line-height: 1.3;
      letter-spacing: -0.02em;
    }

    .map-description {
      max-width: 900px;
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.65;
    }

    .diagram-wrap {
      padding: 14px;
    }

    .diagram-note {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 2px 11px;
      color: var(--faint);
      font-size: 10px;
      line-height: 1.5;
    }

    .status-legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px;
    }

    .status-legend span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .status-legend i {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--green);
    }

    .status-legend .partial {
      background: var(--amber);
    }

    .status-legend .planned {
      background: var(--purple);
    }

    .diagram {
      position: relative;
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      grid-auto-rows: 104px;
      gap: 24px 20px;
      min-height: calc(var(--rows, 5) * 128px);
      padding: 18px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.035);
      border-radius: 13px;
      background:
        linear-gradient(rgba(255, 255, 255, 0.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.018) 1px, transparent 1px),
        rgba(8, 12, 17, 0.55);
      background-size: 24px 24px;
    }

    .edge-layer {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }

    .edge-path {
      fill: none;
      stroke: #4b5d73;
      stroke-width: 1.5;
      marker-end: url(#arrow);
      transition:
        stroke-width 150ms ease,
        filter 150ms ease;
    }

    .edge-path.persist {
      stroke: #4da782;
      marker-end: url(#arrow-green);
    }

    .edge-path.contract {
      stroke: #8c77ca;
      stroke-dasharray: 5 5;
      marker-end: url(#arrow-purple);
    }

    .edge-path.both {
      marker-start: url(#arrow);
    }

    .edge-path.projected {
      stroke-width: 1.8;
    }

    .edge-path.selected {
      stroke-width: 3;
      filter: drop-shadow(0 0 5px rgba(120, 169, 255, 0.48));
    }

    .edge-hit {
      fill: none;
      stroke: transparent;
      stroke-width: 16;
      pointer-events: stroke;
      cursor: pointer;
    }

    .edge-port {
      fill: #0d131b;
      stroke: #7890ad;
      stroke-width: 2;
    }

    .edge-port.selected {
      fill: #78a9ff;
      stroke: #dce9ff;
    }

    .edge-control-layer {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }

    .edge-control {
      position: absolute;
      width: max-content;
      max-width: 240px;
      padding: 4px 7px;
      overflow: hidden;
      transform: translate(-50%, -50%);
      border: 1px solid #2b3848;
      border-radius: 6px;
      color: #8fa0b5;
      background: #0d131b;
      cursor: pointer;
      font-size: 9px;
      font-weight: 600;
      line-height: 1.25;
      pointer-events: auto;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .edge-control:hover,
    .edge-control[aria-pressed="true"] {
      border-color: rgba(120, 169, 255, 0.66);
      color: #dce9ff;
      background: #162235;
    }

    .edge-control.cross-module::after {
      margin-left: 5px;
      color: var(--blue);
      content: "↗";
    }

    .edge-control.cross-module {
      white-space: normal;
    }

    .node {
      position: relative;
      z-index: 2;
      display: grid;
      align-content: start;
      gap: 5px;
      min-width: 0;
      padding: 12px 13px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--text);
      background: linear-gradient(145deg, rgba(23, 33, 45, 0.98), rgba(16, 23, 32, 0.98));
      box-shadow: 0 12px 25px rgba(0, 0, 0, 0.18);
      cursor: pointer;
      text-align: left;
      transition:
        transform 150ms ease,
        border-color 150ms ease,
        background 150ms ease;
    }

    .node:hover {
      transform: translateY(-2px);
      border-color: var(--line-strong);
    }

    .node[aria-pressed="true"] {
      border-color: rgba(120, 169, 255, 0.68);
      background: linear-gradient(145deg, rgba(32, 48, 68, 0.98), rgba(18, 28, 39, 0.98));
      box-shadow:
        0 0 0 2px rgba(120, 169, 255, 0.12),
        0 14px 30px rgba(0, 0, 0, 0.23);
    }

    .mobile-relations {
      display: none;
    }

    .node.planned {
      border-color: rgba(184, 156, 255, 0.34);
      background: linear-gradient(145deg, rgba(40, 31, 57, 0.88), rgba(20, 20, 31, 0.96));
    }

    .node.partial {
      border-color: rgba(241, 189, 112, 0.32);
      background: linear-gradient(145deg, rgba(53, 41, 26, 0.82), rgba(25, 23, 21, 0.96));
    }

    .node-topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
    }

    .node-tag {
      min-width: 0;
      overflow: hidden;
      color: var(--faint);
      font-size: 8px;
      font-weight: 800;
      letter-spacing: 0.09em;
      text-overflow: ellipsis;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .node-status {
      flex: 0 0 auto;
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--green);
      box-shadow: 0 0 0 3px var(--green-soft);
    }

    .node.partial .node-status {
      background: var(--amber);
      box-shadow: 0 0 0 3px var(--amber-soft);
    }

    .node.planned .node-status {
      background: var(--purple);
      box-shadow: 0 0 0 3px var(--purple-soft);
    }

    .node-title {
      min-width: 0;
      overflow: hidden;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .node-caption {
      display: -webkit-box;
      overflow: hidden;
      color: var(--muted);
      font-size: 9px;
      line-height: 1.45;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .node-enter {
      position: absolute;
      right: 9px;
      bottom: 7px;
      color: var(--blue);
      font-size: 12px;
      font-weight: 700;
    }

    .inspector {
      position: sticky;
      top: 14px;
      overflow: hidden;
    }

    .inspector-content {
      padding: 19px;
    }

    .inspector-status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 12px;
      padding: 5px 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.025);
      font-size: 9px;
      font-weight: 700;
    }

    .inspector-status i {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--green);
    }

    .inspector-status.partial i {
      background: var(--amber);
    }

    .inspector-status.planned i {
      background: var(--purple);
    }

    .inspector-status.relation i {
      background: var(--blue);
    }

    .inspector h3 {
      margin-bottom: 8px;
      font-size: 18px;
      line-height: 1.3;
      letter-spacing: -0.02em;
    }

    .inspector-summary {
      margin-bottom: 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.7;
    }

    .detail-section {
      margin-top: 17px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }

    .detail-section h4 {
      margin: 0 0 8px;
      color: var(--faint);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }

    .detail-section ul {
      display: grid;
      gap: 6px;
      margin: 0;
      padding-left: 17px;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.55;
    }

    .detail-section li::marker {
      color: var(--faint);
    }

    .key-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .key-chip {
      padding: 5px 7px;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: #bed0e7;
      background: rgba(255, 255, 255, 0.025);
      font-family: "Cascadia Code", "SFMono-Regular", Consolas, monospace;
      font-size: 9px;
    }

    .source-list {
      display: grid;
      gap: 6px;
    }

    .source-list code {
      display: block;
      padding: 6px 7px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.022);
      font-size: 9px;
      line-height: 1.45;
    }

    .enter-button {
      width: 100%;
      margin-top: 18px;
      border-color: rgba(120, 169, 255, 0.34);
      color: #dce9ff;
      background: var(--blue-soft);
      font-weight: 700;
    }

    .footer-note {
      margin: 13px 2px 0;
      color: var(--faint);
      font-size: 10px;
      line-height: 1.6;
    }

    @media (max-width: 1480px) {
      .content {
        grid-template-columns: 1fr;
      }

      .inspector {
        position: static;
      }
    }

    @media (max-width: 1060px) {
      .page {
        padding: 10px;
      }

      .topbar {
        display: grid;
      }

      .baseline {
        justify-self: start;
        text-align: left;
      }

      .toolbar {
        align-items: flex-start;
      }

      .diagram-note {
        display: grid;
      }

      .status-legend {
        justify-content: flex-start;
      }

      .diagram {
        display: block;
        min-height: 0 !important;
      }

      .edge-layer {
        display: none;
      }

      .edge-control-layer {
        display: none;
      }

      .node {
        width: 100%;
        min-height: 82px;
        margin-bottom: 10px;
      }

      .node:last-child {
        margin-bottom: 0;
      }

      .mobile-relations {
        display: grid;
        gap: 7px;
        margin-top: 10px;
      }

      .mobile-relation {
        width: 100%;
        padding: 9px 10px;
        border: 1px solid var(--line);
        border-radius: 9px;
        color: var(--muted);
        background: rgba(255, 255, 255, 0.025);
        cursor: pointer;
        font-size: 10px;
        line-height: 1.45;
        text-align: left;
      }

      .mobile-relation[aria-pressed="true"] {
        border-color: rgba(120, 169, 255, 0.66);
        color: var(--text);
        background: var(--blue-soft);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .node {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand">
        <p class="eyebrow">Learning Companion · Top-down architecture</p>
        <h1>先抓主线，再下钻实现</h1>
        <p class="intro">
          第一层只看 Electron 的信任边界；进入模块后才展示它自己的协作关系。
          跨模块调用只连到当前视图边缘，避免把整棵依赖树一次铺开。
        </p>
      </div>
      <div class="baseline">
        源码核对：2026-08-09<br>
        main 基线：ab3c630
      </div>
    </header>

    <nav class="toolbar" aria-label="架构层级导航">
      <div id="breadcrumbs" class="breadcrumbs"></div>
      <div class="toolbar-actions">
        <button id="backButton" class="toolbar-button" type="button">← 返回</button>
        <button id="homeButton" class="toolbar-button" type="button">总览</button>
      </div>
    </nav>

    <main class="content">
      <section class="map-panel" aria-labelledby="mapTitle">
        <header class="map-header">
          <p id="mapKicker" class="map-kicker"></p>
          <h2 id="mapTitle" class="map-title"></h2>
          <p id="mapDescription" class="map-description"></p>
        </header>
        <div class="diagram-wrap">
          <div class="diagram-note">
            <span>单击节点或关系说明查看详情；双击节点，或使用右侧按钮进入下一层。</span>
            <span class="status-legend" aria-label="实现状态">
              <span><i></i>已实现</span>
              <span><i class="partial"></i>接口已就绪</span>
              <span><i class="planned"></i>规划中</span>
            </span>
          </div>
          <div id="diagram" class="diagram">
            <svg id="edgeLayer" class="edge-layer" aria-hidden="true">
              <defs>
                <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                  <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5d73"></path>
                </marker>
                <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                  <path d="M 0 0 L 10 5 L 0 10 z" fill="#4da782"></path>
                </marker>
                <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                  <path d="M 0 0 L 10 5 L 0 10 z" fill="#8c77ca"></path>
                </marker>
              </defs>
              <g id="edgePaths"></g>
              <g id="edgePorts"></g>
            </svg>
            <div id="edgeControls" class="edge-control-layer"></div>
            <div id="nodeLayer" style="display: contents"></div>
          </div>
          <div id="mobileRelations" class="mobile-relations" aria-label="当前视图关系"></div>
        </div>
      </section>

      <aside class="inspector" aria-live="polite">
        <div id="inspectorContent" class="inspector-content"></div>
      </aside>
    </main>

    <p class="footer-note">
      图只描述当前主干代码和已经明确的扩展方向。状态为“规划中”的节点不是现有 API，
      接入第二种同类能力前应先把该统一入口实现出来。
    </p>
  </div>

  <script>
    (function () {
      "use strict";

      var statusLabels = {
        implemented: "已实现",
        partial: "接口已就绪，后端未完整落地",
        planned: "规划中"
      };

      function N(id, title, input) {
        return Object.assign({
          id: id,
          title: title,
          tag: "",
          caption: "",
          summary: "",
          status: "implemented",
          responsibilities: [],
          boundaries: [],
          keys: [],
          files: [],
          col: 1,
          row: 1,
          span: 3,
          rowSpan: 1,
          kind: "module"
        }, input || {});
      }

      var views = {
        overview: {
          title: "Electron 顶层边界",
          kicker: "LEVEL 1 · SYSTEM",
          description: "四个节点就是第一眼需要记住的全部：React 负责界面，Preload 负责白名单桥接，Electron Main 负责可信行为，Shared 负责三端共同理解的数据契约。",
          rows: 5,
          nodes: [
            N("react", "React Renderer", {
              tag: "UI PROCESS",
              caption: "页面、选择、临时状态、Workbench View",
              summary: "不可信 UI 层。只通过 window.learningCompanion 请求 Main，不直接访问 Node、SQLite、凭证或子进程。",
              responsibilities: ["组合 Home、ProjectPage、Settings 和 Generation UI。", "承载 Renderer Workbench Registry 与当前 Workbench View。"],
              boundaries: ["业务写入和文件访问必须越过 Preload。"],
              files: ["src/renderer/App.tsx", "src/renderer/project/ProjectPage.tsx"],
              child: "renderer",
              col: 1,
              row: 2,
              span: 3
            }),
            N("preload", "Preload / IPC Bridge", {
              tag: "TRUST BRIDGE",
              caption: "window.learningCompanion · invoke · events",
              summary: "唯一的 Renderer → Main 调用面。它只暴露类型化白名单方法，并把 IPC 成功或错误转换成统一结果。",
              responsibilities: ["封装 ipcRenderer.invoke。", "订阅 Asset、Generation、Provider、External Library 与 Workbench Facility 事件。"],
              boundaries: ["不保存领域状态，不决定 Workbench，不实现业务规则。"],
              files: ["src/preload/index.ts", "src/shared/ipc.ts"],
              child: "preload",
              col: 5,
              row: 2,
              span: 3
            }),

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function canonicalTrail(viewId) {
        var trail = [];
        var current = viewId;
        var guard = new Set();

        while (views[current] && !guard.has(current)) {
          guard.add(current);
          trail.unshift(current);
          current = views[current].parent;
        }

        if (trail[0] !== "overview") {
          trail.unshift("overview");
        }
        return trail;
      }

      function isDescendantView(viewId, ancestorViewId) {
        var current = viewId;
        var guard = new Set();

        while (views[current] && !guard.has(current)) {
          if (current === ancestorViewId) {
            return true;
          }
          guard.add(current);
          current = views[current].parent;
        }
        return false;
      }

      function shouldPreserveActiveRelation(viewId) {
        return Boolean(
          state.activeRelation &&
          isDescendantView(state.activeRelation.originViewId, viewId)
        );
      }

      function navigate(viewId, options) {
        if (!views[viewId]) {
          return;
        }
        var preserveRelation = Boolean(
          options && options.preserveRelation && state.activeRelation
        );
        state.viewId = viewId;
        state.selection = preserveRelation
          ? { kind: "relation", id: state.activeRelation.id }
          : null;
        if (!preserveRelation) {
          state.activeRelation = null;
        }
        history.replaceState(null, "", "#" + viewId);
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function renderBreadcrumbs() {
        var trail = canonicalTrail(state.viewId);
        breadcrumbs.innerHTML = "";

        trail.forEach(function (viewId, index) {
          if (index > 0) {
            var separator = document.createElement("span");
            separator.className = "crumb-separator";
            separator.textContent = "›";
            breadcrumbs.appendChild(separator);
          }

          var button = document.createElement("button");
          button.type = "button";
          button.className = "crumb";
          button.textContent = views[viewId].title;
          if (viewId === state.viewId) {
            button.setAttribute("aria-current", "page");
          } else {
            button.addEventListener("click", function () {
              navigate(viewId, {
                preserveRelation: shouldPreserveActiveRelation(viewId)
              });
            });
          }
          breadcrumbs.appendChild(button);
        });

        backButton.disabled = state.viewId === "overview";
      }

      function visibleNodes(view) {
        return view.nodes.filter(function (node) {
          return node.kind !== "boundary";
        });
      }

      function findNode(view, nodeId) {
        return view.nodes.find(function (node) {
          return node.id === nodeId;
        });
      }

      function relationId(viewId, edge, index) {
        return edge.id || [viewId, edge.from, edge.to, edge.label || index].join("::");
      }

      function baseRelations(viewId) {
        var view = views[viewId];
        return view.edges.map(function (edge, index) {
          return {
            id: relationId(viewId, edge, index),
            viewId: viewId,
            edge: edge,
            from: findNode(view, edge.from),
            to: findNode(view, edge.to),
            projected: false,
            active: null
          };
        }).filter(function (relation) {
          return Boolean(relation.from && relation.to);
        });
      }

      function boundarySideFromLayout(node, view) {
        if (node.preferredSide) {
          return node.preferredSide;
        }
        var x = (node.col - 1 + node.span / 2) / 12;
        var y = (node.row - 1 + node.rowSpan / 2) / Math.max(view.rows, 1);
        var candidates = [
          { side: "left", distance: x },
          { side: "right", distance: 1 - x },
          { side: "top", distance: y },
          { side: "bottom", distance: 1 - y }
        ];
        candidates.sort(function (left, right) {
          return left.distance - right.distance;
        });
        return candidates[0].side;
      }

      function endpointDescriptor(viewId, node) {
        var view = views[viewId];
        if (node.kind === "boundary") {
          return {
            kind: node.target ? "view" : "external",
            viewId: node.target || null,
            nodeId: null,
            ownerViewId: null,
            title: node.title,
            summary: node.summary,
            files: node.files.slice(),
            hint: {
              col: node.col,
              row: node.row,
              span: node.span,
              rowSpan: node.rowSpan,
              preferredSide: boundarySideFromLayout(node, view)
            }
          };
        }
        return {
          kind: "node",
          viewId: null,
          nodeId: node.id,
          ownerViewId: viewId,
          title: node.title,
          summary: node.summary,
          files: node.files.slice(),
          hint: null
        };
      }

      function relationIsCrossModule(relation) {
        return relation.projected ||
          relation.from.kind === "boundary" ||
          relation.to.kind === "boundary";
      }

      function captureActiveRelation(relation) {
        return {
          id: relation.id,
          originViewId: relation.viewId,
          edge: Object.assign({}, relation.edge),
          from: endpointDescriptor(relation.viewId, relation.from),
          to: endpointDescriptor(relation.viewId, relation.to)
        };
      }

      function directChildView(ancestorViewId, descendantViewId) {
        var current = descendantViewId;
        var guard = new Set();

        while (views[current] && !guard.has(current)) {
          guard.add(current);
          if (views[current].parent === ancestorViewId) {
            return current;
          }
          current = views[current].parent;
        }
        return null;
      }

      function moduleNodeForView(activeViewId, descendantViewId) {
        var childViewId = directChildView(activeViewId, descendantViewId);
        if (!childViewId) {
          return null;
        }
        return views[activeViewId].nodes.find(function (node) {
          return node.kind !== "boundary" && node.child === childViewId;
        }) || null;
      }

      function projectedBoundary(descriptor, role, view) {
        var hint = descriptor.hint || {};
        var preferredSide = hint.preferredSide || (role === "from" ? "left" : "right");
        return N("__boundary-" + role + "-" + (descriptor.viewId || descriptor.title), descriptor.title, {
          tag: "CONTINUES OUTSIDE THIS VIEW",
          caption: descriptor.summary,
          summary: descriptor.summary,
          files: descriptor.files,
          kind: "boundary",
          target: descriptor.viewId,
          preferredSide: preferredSide,
          col: hint.col || (preferredSide === "left" ? 1 : 12),
          row: hint.row || Math.ceil(view.rows / 2),
          span: hint.span || 1,
          rowSpan: hint.rowSpan || 1
        });
      }

      function projectEndpoint(descriptor, activeViewId, role) {
        var view = views[activeViewId];
        var descendantViewId = descriptor.kind === "node"
          ? descriptor.ownerViewId
          : descriptor.viewId;

        if (descriptor.kind === "node" && descriptor.ownerViewId === activeViewId) {
          return findNode(view, descriptor.nodeId);
        }
        if (
          descendantViewId &&
          descendantViewId !== activeViewId &&
          isDescendantView(descendantViewId, activeViewId)
        ) {
          var moduleNode = moduleNodeForView(activeViewId, descendantViewId);
          if (moduleNode) {
            return moduleNode;
          }
        }
        return projectedBoundary(descriptor, role, view);
      }

      function endpointKey(node) {
        if (node.kind === "boundary") {
          return "boundary:" + (node.target || node.title);
        }
        return "node:" + node.id;
      }

      function projectActiveRelation(viewId) {
        var active = state.activeRelation;
        if (!active || active.originViewId === viewId || !isDescendantView(active.originViewId, viewId)) {
          return null;
        }
        var from = projectEndpoint(active.from, viewId, "from");
        var to = projectEndpoint(active.to, viewId, "to");
        if (!from || !to) {
          return null;
        }
        if (from.kind === "boundary" && to.kind === "boundary") {
          return null;
        }
        if (from.kind !== "boundary" && to.kind !== "boundary" && from.id === to.id) {
          return null;
        }
        return {
          id: active.id,
          viewId: viewId,
          edge: Object.assign({}, active.edge),
          from: from,
          to: to,
          projected: true,
          active: active
        };
      }

      function relationsForView(viewId) {
        var relations = baseRelations(viewId);
        var projected = projectActiveRelation(viewId);
        if (!projected) {
          return relations;
        }
        var fromKey = endpointKey(projected.from);
        var toKey = endpointKey(projected.to);
        var matchIndex = relations.findIndex(function (relation) {
          var exact = endpointKey(relation.from) === fromKey && endpointKey(relation.to) === toKey;
          var reversible = projected.edge.tone === "both" || relation.edge.tone === "both";
          var reversed = endpointKey(relation.from) === toKey && endpointKey(relation.to) === fromKey;
          return exact || (reversible && reversed);
        });
        if (matchIndex >= 0) {
          relations[matchIndex] = Object.assign({}, relations[matchIndex], {
            id: projected.id,
            projected: true,
            active: projected.active
          });
        } else {
          relations.push(projected);
        }
        return relations;
      }

      function ensureSelection(view, relations) {
        var nodes = visibleNodes(view);
        var selectionExists = state.selection && (
          state.selection.kind === "node"
            ? nodes.some(function (node) { return node.id === state.selection.id; })
            : relations.some(function (relation) { return relation.id === state.selection.id; })
        );
        if (!selectionExists) {
          state.selection = nodes[0]
            ? { kind: "node", id: nodes[0].id }
            : (relations[0] ? { kind: "relation", id: relations[0].id } : null);
        }
      }

      function renderNodes(view, relations) {
        nodeLayer.innerHTML = "";
        ensureSelection(view, relations);

        visibleNodes(view).forEach(function (node) {
          var button = document.createElement("button");
          button.type = "button";
          button.id = "node-" + node.id;
          button.className = "node " + node.status;
          button.style.gridColumn = node.col + " / span " + node.span;
          button.style.gridRow = node.row + " / span " + node.rowSpan;
          button.setAttribute(
            "aria-pressed",
            state.selection && state.selection.kind === "node" && node.id === state.selection.id
              ? "true"
              : "false"
          );
          button.innerHTML =
            '<span class="node-topline">' +
              '<span class="node-tag">' + escapeHtml(node.tag) + '</span>' +
              '<span class="node-status" aria-hidden="true"></span>' +
            '</span>' +
            '<span class="node-title">' + escapeHtml(node.title) + '</span>' +
            '<span class="node-caption">' + escapeHtml(node.caption) + '</span>' +
            (node.child || node.target ? '<span class="node-enter" aria-hidden="true">↘</span>' : "");

          button.addEventListener("click", function () {
            state.selection = { kind: "node", id: node.id };
            state.activeRelation = null;
            render();
          });
          button.addEventListener("dblclick", function () {
            if (node.child || node.target) {
              navigate(node.child || node.target);
            }
          });
          nodeLayer.appendChild(button);
        });
      }

      function nodeDetailSections(node) {
        var sections = "";

        if (node.responsibilities.length) {
          sections +=
            '<section class="detail-section"><h4>负责什么</h4><ul>' +
            node.responsibilities.map(function (item) {
              return "<li>" + escapeHtml(item) + "</li>";
            }).join("") +
            "</ul></section>";
        }

        if (node.boundaries.length) {
          sections +=
            '<section class="detail-section"><h4>不要放进这里</h4><ul>' +
            node.boundaries.map(function (item) {
              return "<li>" + escapeHtml(item) + "</li>";
            }).join("") +
            "</ul></section>";
        }

        if (node.keys.length) {
          sections +=
            '<section class="detail-section"><h4>关键键 / 契约</h4><div class="key-list">' +
            node.keys.map(function (item) {
              return '<span class="key-chip">' + escapeHtml(item) + "</span>";
            }).join("") +
            "</div></section>";
        }

        if (node.files.length) {
          sections +=
            '<section class="detail-section"><h4>源码入口</h4><div class="source-list">' +
            node.files.map(function (item) {
              return "<code>" + escapeHtml(item) + "</code>";
            }).join("") +
            "</div></section>";
        }

        return sections;
      }

      function renderNodeSelection(view, node) {
        var sections = nodeDetailSections(node);

        var destination = node.child || node.target;
        var buttonLabel = node.child ? "进入该模块 →" : "打开相关模块 →";
        inspectorContent.innerHTML =
          '<div class="inspector-status ' + node.status + '"><i></i>' +
            escapeHtml(statusLabels[node.status]) +
          "</div>" +
          "<h3>" + escapeHtml(node.title) + "</h3>" +
          '<p class="inspector-summary">' + escapeHtml(node.summary || node.caption) + "</p>" +
          sections +
          (destination
            ? '<button id="enterButton" class="enter-button" type="button">' + buttonLabel + "</button>"
            : "");

        if (destination) {
          document.getElementById("enterButton").addEventListener("click", function () {
            navigate(destination);
          });
        }
      }

      function cleanEndpointTitle(title) {
        return String(title).replace(/^[←→]\s*/, "");
      }

      function relationSourceFiles(relation) {
        var files = [];
        var endpoints = relation.active
          ? [relation.active.from, relation.active.to]
          : [endpointDescriptor(relation.viewId, relation.from), endpointDescriptor(relation.viewId, relation.to)];
        endpoints.forEach(function (endpoint) {
          endpoint.files.forEach(function (file) {
            if (files.indexOf(file) < 0) {
              files.push(file);
            }
          });
        });
        return files;
      }

      function relationOriginalEndpoints(relation) {
        if (relation.active) {
          return { from: relation.active.from, to: relation.active.to };
        }
        return {
          from: endpointDescriptor(relation.viewId, relation.from),
          to: endpointDescriptor(relation.viewId, relation.to)
        };
      }

      function relationDestination(relation) {
        var endpoints = relationOriginalEndpoints(relation);
        if (endpoints.to.kind !== "node" && endpoints.to.viewId) {
          return endpoints.to.viewId;
        }
        if (endpoints.from.kind !== "node" && endpoints.from.viewId) {
          return endpoints.from.viewId;
        }
        return null;
      }

      function relationSummary(relation) {
        var endpoints = relationOriginalEndpoints(relation);
        var boundaryEndpoint = relation.from.kind === "boundary" ? relation.from :
          (relation.to.kind === "boundary" ? relation.to : null);
        return (relation.active && relation.active.edge.summary) ||
          relation.edge.summary ||
          (boundaryEndpoint && boundaryEndpoint.summary) ||
          cleanEndpointTitle(endpoints.from.title) + " 通过“" +
            (relation.edge.label || "连接") + "”连接到 " +
            cleanEndpointTitle(endpoints.to.title) + "。";
      }

      function renderRelationSelection(relation) {
        var endpoints = relationOriginalEndpoints(relation);
        var sourceTitle = cleanEndpointTitle(endpoints.from.title);
        var targetTitle = cleanEndpointTitle(endpoints.to.title);
        var crossModule = relationIsCrossModule(relation);
        var files = relationSourceFiles(relation);
        var currentProjection = cleanEndpointTitle(relation.from.title) + " → " +
          cleanEndpointTitle(relation.to.title);
        var sections =
          '<section class="detail-section"><h4>连接到哪里</h4><ul>' +
            "<li>" + escapeHtml(sourceTitle) + " → " + escapeHtml(targetTitle) + "</li>" +
            (relation.projected
              ? "<li>当前层投影：" + escapeHtml(currentProjection) + "</li>"
              : "") +
            "<li>关系 ID：<code>" + escapeHtml(relation.id) + "</code></li>" +
          "</ul></section>";

        if (files.length) {
          sections +=
            '<section class="detail-section"><h4>源码依据</h4><div class="source-list">' +
            files.map(function (file) {
              return "<code>" + escapeHtml(file) + "</code>";
            }).join("") +
            "</div></section>";
        }

        var destination = relationDestination(relation);
        inspectorContent.innerHTML =
          '<div class="inspector-status relation"><i></i>' +
            (crossModule ? "跨模块关系" : "模块内关系") +
          "</div>" +
          "<h3>" + escapeHtml(relation.edge.label || (sourceTitle + " → " + targetTitle)) + "</h3>" +
          '<p class="inspector-summary">' + escapeHtml(relationSummary(relation)) + "</p>" +
          sections +
          (destination
            ? '<button id="enterButton" class="enter-button" type="button">打开目标模块 →</button>'
            : "");

        if (destination) {
          document.getElementById("enterButton").addEventListener("click", function () {
            navigate(destination);
          });
        }
      }

      function renderSelection(view, relations) {
        Array.prototype.forEach.call(nodeLayer.querySelectorAll(".node"), function (button) {
          var selected = state.selection && state.selection.kind === "node" &&
            button.id === "node-" + state.selection.id;
          button.setAttribute("aria-pressed", selected ? "true" : "false");
        });

        if (state.selection && state.selection.kind === "relation") {
          var relation = relations.find(function (candidate) {
            return candidate.id === state.selection.id;
          });
          if (relation) {
            renderRelationSelection(relation);
            return;
          }
        }

        var node = visibleNodes(view).find(function (candidate) {
          return state.selection && candidate.id === state.selection.id;
        }) || visibleNodes(view)[0];
        if (node) {
          renderNodeSelection(view, node);
        } else {
          inspectorContent.innerHTML = '<p class="inspector-summary">当前视图没有可检查的节点。</p>';
        }
      }

      function anchorFor(element, other, bounds) {
        var box = element.getBoundingClientRect();
        var otherBox = other.getBoundingClientRect();
        var centerX = box.left - bounds.left + box.width / 2;
        var centerY = box.top - bounds.top + box.height / 2;
        var otherX = otherBox.left - bounds.left + otherBox.width / 2;
        var otherY = otherBox.top - bounds.top + otherBox.height / 2;
        var dx = otherX - centerX;
        var dy = otherY - centerY;

        if (Math.abs(dx) >= Math.abs(dy)) {
          return {
            x: dx >= 0 ? box.right - bounds.left : box.left - bounds.left,
            y: centerY,
            side: "horizontal",
            edge: dx >= 0 ? "right" : "left"
          };
        }

        return {
          x: centerX,
          y: dy >= 0 ? box.bottom - bounds.top : box.top - bounds.top,
          side: "vertical",
          edge: dy >= 0 ? "bottom" : "top"
        };
      }

      function anchorForPoint(element, point, bounds) {
        var box = element.getBoundingClientRect();
        var centerX = box.left - bounds.left + box.width / 2;
        var centerY = box.top - bounds.top + box.height / 2;
        var dx = point.x - centerX;
        var dy = point.y - centerY;

        if (Math.abs(dx) >= Math.abs(dy)) {
          return {
            x: dx >= 0 ? box.right - bounds.left : box.left - bounds.left,
            y: centerY,
            side: "horizontal",
            edge: dx >= 0 ? "right" : "left"
          };
        }
        return {
          x: centerX,
          y: dy >= 0 ? box.bottom - bounds.top : box.top - bounds.top,
          side: "vertical",
          edge: dy >= 0 ? "bottom" : "top"
        };
      }

      function clamp(value, minimum, maximum) {
        return Math.max(minimum, Math.min(maximum, value));
      }

      function boundaryPointFor(node, view, bounds) {
        var side = boundarySideFromLayout(node, view);
        var normalizedX = (node.col - 1 + node.span / 2) / 12;
        var normalizedY = (node.row - 1 + node.rowSpan / 2) / Math.max(view.rows, 1);
        var x = clamp(normalizedX * bounds.width, 18, bounds.width - 18);
        var y = clamp(normalizedY * bounds.height, 18, bounds.height - 18);
        var inset = 2;

        if (side === "left") {
          return { x: inset, y: y, side: "horizontal", edge: "right" };
        }
        if (side === "right") {
          return { x: bounds.width - inset, y: y, side: "horizontal", edge: "left" };
        }
        if (side === "top") {
          return { x: x, y: inset, side: "vertical", edge: "bottom" };
        }
        return { x: x, y: bounds.height - inset, side: "vertical", edge: "top" };
      }

      function relationGeometry(relation, view, bounds) {
        var fromBoundary = relation.from.kind === "boundary";
        var toBoundary = relation.to.kind === "boundary";
        if (fromBoundary && toBoundary) {
          return null;
        }
        if (!fromBoundary && !toBoundary) {
          var fromElement = document.getElementById("node-" + relation.from.id);
          var toElement = document.getElementById("node-" + relation.to.id);
          if (!fromElement || !toElement) {
            return null;
          }
          return {
            start: anchorFor(fromElement, toElement, bounds),
            end: anchorFor(toElement, fromElement, bounds),
            port: null
          };
        }

        var boundaryNode = fromBoundary ? relation.from : relation.to;
        var localNode = fromBoundary ? relation.to : relation.from;
        var localElement = document.getElementById("node-" + localNode.id);
        if (!localElement) {
          return null;
        }
        var port = boundaryPointFor(boundaryNode, view, bounds);
        var localAnchor = anchorForPoint(localElement, port, bounds);
        return fromBoundary
          ? { start: port, end: localAnchor, port: port }
          : { start: localAnchor, end: port, port: port };
      }

      function pathBetween(start, end) {
        if (start.side === "horizontal" || end.side === "horizontal") {
          var middleX = (start.x + end.x) / 2;
          return "M " + start.x + " " + start.y +
            " C " + middleX + " " + start.y +
            ", " + middleX + " " + end.y +
            ", " + end.x + " " + end.y;
        }

        var middleY = (start.y + end.y) / 2;
        return "M " + start.x + " " + start.y +
          " C " + start.x + " " + middleY +
          ", " + end.x + " " + middleY +
          ", " + end.x + " " + end.y;
      }

      function moveAlongEdge(point, distance, bounds) {
        var moved = { x: point.x, y: point.y };
        if (point.edge === "left") {
          moved.x -= distance;
        } else if (point.edge === "right") {
          moved.x += distance;
        } else if (point.edge === "top") {
          moved.y -= distance;
        } else {
          moved.y += distance;
        }
        moved.x = clamp(moved.x, 6, bounds.width - 6);
        moved.y = clamp(moved.y, 6, bounds.height - 6);
        return moved;
      }

      function coordinateKey(x, y) {
        return x.toFixed(2) + "," + y.toFixed(2);
      }

      function uniqueCoordinates(values) {
        return values
          .sort(function (left, right) { return left - right; })
          .filter(function (value, index, all) {
            return index === 0 || Math.abs(value - all[index - 1]) > 0.5;
          });
      }

      function pointInsideObstacle(point, obstacle) {
        return point.x > obstacle.left && point.x < obstacle.right &&
          point.y > obstacle.top && point.y < obstacle.bottom;
      }

      function segmentIsClear(start, end, obstacles) {
        if (Math.abs(start.x - end.x) < 0.5) {
          var verticalTop = Math.min(start.y, end.y);
          var verticalBottom = Math.max(start.y, end.y);
          return !obstacles.some(function (obstacle) {
            return start.x > obstacle.left && start.x < obstacle.right &&
              verticalBottom > obstacle.top && verticalTop < obstacle.bottom;
          });
        }
        if (Math.abs(start.y - end.y) < 0.5) {
          var horizontalLeft = Math.min(start.x, end.x);
          var horizontalRight = Math.max(start.x, end.x);
          return !obstacles.some(function (obstacle) {
            return start.y > obstacle.top && start.y < obstacle.bottom &&
              horizontalRight > obstacle.left && horizontalLeft < obstacle.right;
          });
        }
        return false;
      }

      function simplifyRoute(points) {
        var deduplicated = points.filter(function (point, index) {
          return index === 0 || Math.abs(point.x - points[index - 1].x) > 0.5 ||
            Math.abs(point.y - points[index - 1].y) > 0.5;
        });
        return deduplicated.filter(function (point, index) {
          if (index === 0 || index === deduplicated.length - 1) {
            return true;
          }
          var previous = deduplicated[index - 1];
          var next = deduplicated[index + 1];
          var sameHorizontal = Math.abs(previous.y - point.y) < 0.5 &&
            Math.abs(point.y - next.y) < 0.5;
          var sameVertical = Math.abs(previous.x - point.x) < 0.5 &&
            Math.abs(point.x - next.x) < 0.5;
          return !sameHorizontal && !sameVertical;
        });
      }

      function roundedRoutePath(points) {
        var route = simplifyRoute(points);
        if (route.length < 2) {
          return "";
        }
        var output = "M " + route[0].x + " " + route[0].y;
        for (var index = 1; index < route.length - 1; index += 1) {
          var previous = route[index - 1];
          var current = route[index];
          var next = route[index + 1];
          var previousDistance = Math.hypot(
            current.x - previous.x,
            current.y - previous.y
          );
          var nextDistance = Math.hypot(
            next.x - current.x,
            next.y - current.y
          );
          var radius = Math.min(10, previousDistance / 2, nextDistance / 2);
          var before = {
            x: current.x + (previous.x - current.x) * radius / previousDistance,
            y: current.y + (previous.y - current.y) * radius / previousDistance
          };
          var after = {
            x: current.x + (next.x - current.x) * radius / nextDistance,
            y: current.y + (next.y - current.y) * radius / nextDistance
          };
          output += " L " + before.x + " " + before.y +
            " Q " + current.x + " " + current.y + " " + after.x + " " + after.y;
        }
        var last = route[route.length - 1];
        return output + " L " + last.x + " " + last.y;
      }

      function routeBetween(geometry, bounds) {
        var stubDistance = 9;
        var startStub = moveAlongEdge(geometry.start, stubDistance, bounds);
        var endStub = moveAlongEdge(geometry.end, stubDistance, bounds);
        var obstaclePadding = 7;
        var obstacles = Array.prototype.map.call(
          nodeLayer.querySelectorAll(".node"),
          function (node) {
            var rectangle = localRectangle(node, bounds);
            return {
              left: clamp(rectangle.left - obstaclePadding, 4, bounds.width - 4),
              right: clamp(rectangle.right + obstaclePadding, 4, bounds.width - 4),
              top: clamp(rectangle.top - obstaclePadding, 4, bounds.height - 4),
              bottom: clamp(rectangle.bottom + obstaclePadding, 4, bounds.height - 4)
            };
          }
        );
        var xStops = [6, bounds.width - 6, startStub.x, endStub.x];
        var yStops = [6, bounds.height - 6, startStub.y, endStub.y];

        obstacles.forEach(function (obstacle) {
          xStops.push(obstacle.left, obstacle.right);
          yStops.push(obstacle.top, obstacle.bottom);
        });
        xStops = uniqueCoordinates(xStops);
        yStops = uniqueCoordinates(yStops);
        xStops.slice(1).forEach(function (value, index) {
          var previous = xStops[index];
          if (value - previous > 24) {
            xStops.push((previous + value) / 2);
          }
        });
        yStops.slice(1).forEach(function (value, index) {
          var previous = yStops[index];
          if (value - previous > 24) {
            yStops.push((previous + value) / 2);
          }
        });
        xStops = uniqueCoordinates(xStops);
        yStops = uniqueCoordinates(yStops);

        var points = {};
        var rows = {};
        var columns = {};
        xStops.forEach(function (x) {
          yStops.forEach(function (y) {
            var point = { x: x, y: y };
            var isTerminal = coordinateKey(x, y) === coordinateKey(startStub.x, startStub.y) ||
              coordinateKey(x, y) === coordinateKey(endStub.x, endStub.y);
            if (!isTerminal && obstacles.some(function (obstacle) {
              return pointInsideObstacle(point, obstacle);
            })) {
              return;
            }
            var key = coordinateKey(x, y);
            points[key] = point;
            (rows[y.toFixed(2)] || (rows[y.toFixed(2)] = [])).push(point);
            (columns[x.toFixed(2)] || (columns[x.toFixed(2)] = [])).push(point);
          });
        });

        var graph = {};
        Object.keys(points).forEach(function (key) { graph[key] = []; });
        function connect(left, right, direction) {
          if (!segmentIsClear(left, right, obstacles)) {
            return;
          }
          var leftKey = coordinateKey(left.x, left.y);
          var rightKey = coordinateKey(right.x, right.y);
          var distance = Math.abs(left.x - right.x) + Math.abs(left.y - right.y);
          graph[leftKey].push({ key: rightKey, distance: distance, direction: direction });
          graph[rightKey].push({ key: leftKey, distance: distance, direction: direction });
        }
        Object.keys(rows).forEach(function (key) {
          var row = rows[key].sort(function (left, right) { return left.x - right.x; });
          for (var index = 1; index < row.length; index += 1) {
            connect(row[index - 1], row[index], "horizontal");
          }
        });
        Object.keys(columns).forEach(function (key) {
          var column = columns[key].sort(function (left, right) { return left.y - right.y; });
          for (var index = 1; index < column.length; index += 1) {
            connect(column[index - 1], column[index], "vertical");
          }
        });

        var startKey = coordinateKey(startStub.x, startStub.y);
        var endKey = coordinateKey(endStub.x, endStub.y);
        var distances = {};
        var previousStates = {};
        var openStates = [{ key: startKey, direction: "start", cost: 0 }];
        distances[startKey + "|start"] = 0;
        var finalState = null;
        while (openStates.length) {
          openStates.sort(function (left, right) { return left.cost - right.cost; });
          var current = openStates.shift();
          var currentStateKey = current.key + "|" + current.direction;
          if (current.cost !== distances[currentStateKey]) {
            continue;
          }
          if (current.key === endKey) {
            finalState = currentStateKey;
            break;
          }
          (graph[current.key] || []).forEach(function (edge) {
            var bendCost = current.direction !== "start" &&
              current.direction !== edge.direction ? 28 : 0;
            var nextCost = current.cost + edge.distance + bendCost;
            var nextStateKey = edge.key + "|" + edge.direction;
            if (distances[nextStateKey] === undefined || nextCost < distances[nextStateKey]) {
              distances[nextStateKey] = nextCost;
              previousStates[nextStateKey] = currentStateKey;
              openStates.push({ key: edge.key, direction: edge.direction, cost: nextCost });
            }
          });
        }

        if (!finalState) {
          var boundaryRoutes = [
            [
              startStub,
              { x: startStub.x, y: 6 },
              { x: endStub.x, y: 6 },
              endStub
            ],
            [
              startStub,
              { x: startStub.x, y: bounds.height - 6 },
              { x: endStub.x, y: bounds.height - 6 },
              endStub
            ],
            [
              startStub,
              { x: 6, y: startStub.y },
              { x: 6, y: endStub.y },
              endStub
            ],
            [
              startStub,
              { x: bounds.width - 6, y: startStub.y },
              { x: bounds.width - 6, y: endStub.y },
              endStub
            ]
          ].filter(function (candidate) {
            return candidate.every(function (point, index) {
              return index === 0 || segmentIsClear(candidate[index - 1], point, obstacles);
            });
          }).sort(function (left, right) {
            function lengthOf(candidate) {
              return candidate.slice(1).reduce(function (total, point, index) {
                return total + Math.abs(point.x - candidate[index].x) +
                  Math.abs(point.y - candidate[index].y);
              }, 0);
            }
            return lengthOf(left) - lengthOf(right);
          });
          if (boundaryRoutes.length) {
            return {
              pathData: roundedRoutePath([
                { x: geometry.start.x, y: geometry.start.y }
              ].concat(boundaryRoutes[0], [{ x: geometry.end.x, y: geometry.end.y }])),
              fallback: false
            };
          }
          return {
            pathData: pathBetween(geometry.start, geometry.end),
            fallback: true
          };
        }
        var route = [];
        var cursor = finalState;
        while (cursor) {
          route.push(points[cursor.split("|")[0]]);
          cursor = previousStates[cursor];
        }
        route.reverse();
        route.unshift({ x: geometry.start.x, y: geometry.start.y });
        route.push({ x: geometry.end.x, y: geometry.end.y });
        return {
          pathData: roundedRoutePath(route),
          fallback: false
        };
      }

      function selectRelation(relation) {
        state.selection = { kind: "relation", id: relation.id };
        state.activeRelation = relationIsCrossModule(relation)
          ? (relation.active || captureActiveRelation(relation))
          : null;
        render();
      }

      function relationControlLabel(relation) {
        var label = relation.edge.label || "关系";
        if (relation.from.kind === "boundary") {
          return cleanEndpointTitle(relation.from.title) + " · " + label;
        }
        if (relation.to.kind === "boundary") {
          return label + " · " + cleanEndpointTitle(relation.to.title);
        }
        return label;
      }

      function rectanglesOverlap(left, right, padding) {
        return !(
          left.right + padding <= right.left ||
          left.left >= right.right + padding ||
          left.bottom + padding <= right.top ||
          left.top >= right.bottom + padding
        );
      }

      function localRectangle(element, bounds) {
        var box = element.getBoundingClientRect();
        return {
          left: box.left - bounds.left,
          top: box.top - bounds.top,
          right: box.right - bounds.left,
          bottom: box.bottom - bounds.top,
          width: box.width,
          height: box.height
        };
      }

      function placeEdgeControl(control, geometry, bounds, ownPath) {
        var box = control.getBoundingClientRect();
        var gap = 10;
        var fractions = [0.5, 0.35, 0.65, 0.2, 0.8];
        var candidates = [];
        var pathLength = ownPath.getTotalLength();
        var stepSize = 18;
        for (var level = 0; level < 8; level += 1) {
          fractions.forEach(function (fraction) {
            var centerLength = pathLength * fraction;
            var center = ownPath.getPointAtLength(centerLength);
            var previous = ownPath.getPointAtLength(Math.max(0, centerLength - 3));
            var next = ownPath.getPointAtLength(Math.min(pathLength, centerLength + 3));
            var dx = next.x - previous.x;
            var dy = next.y - previous.y;
            var tangentLength = Math.max(1, Math.hypot(dx, dy));
            var normalX = -dy / tangentLength;
            var normalY = dx / tangentLength;
            var halfExtent = Math.abs(normalX) * box.width / 2 +
              Math.abs(normalY) * box.height / 2;
            var distance = halfExtent + gap + level * stepSize;
            candidates.push({
              x: center.x + normalX * distance,
              y: center.y + normalY * distance
            });
            candidates.push({
              x: center.x - normalX * distance,
              y: center.y - normalY * distance
            });
          });
        }
        var obstacles = Array.prototype.map.call(
          nodeLayer.querySelectorAll(".node"),
          function (node) { return localRectangle(node, bounds); }
        ).concat(Array.prototype.map.call(
          edgeControls.querySelectorAll(".edge-control:not([data-placing='true'])"),
          function (label) { return localRectangle(label, bounds); }
        ));
        var pathPoints = [];
        Array.prototype.forEach.call(edgePaths.querySelectorAll(".edge-path"), function (path) {
          var length = path.getTotalLength();
          for (var pointIndex = 1; pointIndex < 100; pointIndex += 1) {
            pathPoints.push(path.getPointAtLength(length * pointIndex / 100));
          }
        });
        var chosen = null;
        var ranked = [];

        candidates.some(function (candidate) {
          var centerX = clamp(candidate.x, box.width / 2 + 8, bounds.width - box.width / 2 - 8);
          var centerY = clamp(candidate.y, box.height / 2 + 8, bounds.height - box.height / 2 - 8);
          var candidateBox = {
            left: centerX - box.width / 2,
            right: centerX + box.width / 2,
            top: centerY - box.height / 2,
            bottom: centerY + box.height / 2
          };
          var obstacleHits = obstacles.filter(function (obstacle) {
            return rectanglesOverlap(candidateBox, obstacle, 6);
          }).length;
          var pathHits = pathPoints.filter(function (point) {
            return point.x > candidateBox.left - 4 && point.x < candidateBox.right + 4 &&
              point.y > candidateBox.top - 4 && point.y < candidateBox.bottom + 4;
          }).length;
          ranked.push({ x: centerX, y: centerY, score: obstacleHits * 100 + pathHits });
          if (obstacleHits === 0 && pathHits === 0) {
            chosen = { x: centerX, y: centerY };
            return true;
          }
          return false;
        });

        if (!chosen) {
          ranked.sort(function (left, right) { return left.score - right.score; });
          chosen = ranked[0];
          control.setAttribute("data-collision", "true");
        } else {
          control.removeAttribute("data-collision");
        }
        control.style.left = chosen.x + "px";
        control.style.top = chosen.y + "px";
        control.removeAttribute("data-placing");
      }

      function drawEdges(view, relations) {
        cancelAnimationFrame(edgeFrame);
        edgeFrame = requestAnimationFrame(function () {
          var bounds = diagram.getBoundingClientRect();
          var namespace = "http://www.w3.org/2000/svg";
          edgeLayer.setAttribute("viewBox", "0 0 " + bounds.width + " " + bounds.height);
          edgePaths.innerHTML = "";
          edgePorts.innerHTML = "";
          edgeControls.innerHTML = "";
          var renderedRelations = [];

          relations.forEach(function (relation) {
            var geometry = relationGeometry(relation, view, bounds);
            if (!geometry) {
              return;
            }
            var selected = state.selection && state.selection.kind === "relation" &&
              state.selection.id === relation.id;
            var route = routeBetween(geometry, bounds);
            var pathData = route.pathData;
            var path = document.createElementNS(namespace, "path");
            path.setAttribute("d", pathData);
            path.setAttribute(
              "class",
              "edge-path " + (relation.edge.tone || "") +
                (relation.projected ? " projected" : "") +
                (selected ? " selected" : "")
            );
            path.setAttribute("data-relation-id", relation.id);
            path.setAttribute("data-from", relation.from.id);
            path.setAttribute("data-to", relation.to.id);
            if (route.fallback) {
              path.setAttribute("data-route-fallback", "true");
            }
            edgePaths.appendChild(path);

            var hitPath = document.createElementNS(namespace, "path");
            hitPath.setAttribute("d", pathData);
            hitPath.setAttribute("class", "edge-hit");
            hitPath.addEventListener("click", function () {
              selectRelation(relation);
            });
            edgePaths.appendChild(hitPath);

            if (geometry.port) {
              var port = document.createElementNS(namespace, "circle");
              port.setAttribute("cx", geometry.port.x);
              port.setAttribute("cy", geometry.port.y);
              port.setAttribute("r", selected ? "5" : "4");
              port.setAttribute("class", "edge-port" + (selected ? " selected" : ""));
              edgePorts.appendChild(port);
            }

            renderedRelations.push({
              relation: relation,
              geometry: geometry,
              path: path,
              selected: selected
            });
          });

          renderedRelations.forEach(function (rendered) {
            var relation = rendered.relation;
            var control = document.createElement("button");
            control.type = "button";
            control.className = "edge-control" +
              (relationIsCrossModule(relation) ? " cross-module" : "");
            control.setAttribute("data-placing", "true");
            control.setAttribute("data-relation-id", relation.id);
            control.textContent = relationControlLabel(relation);
            control.setAttribute("aria-pressed", rendered.selected ? "true" : "false");
            control.setAttribute(
              "aria-label",
              "查看关系：" + cleanEndpointTitle(relation.from.title) + " 到 " +
                cleanEndpointTitle(relation.to.title) + "，" + relationControlLabel(relation)
            );
            control.addEventListener("click", function () {
              selectRelation(relation);
            });
            edgeControls.appendChild(control);
            placeEdgeControl(control, rendered.geometry, bounds, rendered.path);
          });
        });
      }

      function renderMobileRelations(relations) {
        mobileRelations.innerHTML = "";
        relations.forEach(function (relation) {
          var button = document.createElement("button");
          var selected = state.selection && state.selection.kind === "relation" &&
            state.selection.id === relation.id;
          button.type = "button";
          button.className = "mobile-relation";
          button.setAttribute("aria-pressed", selected ? "true" : "false");
          button.textContent = cleanEndpointTitle(relation.from.title) + " → " +
            cleanEndpointTitle(relation.to.title) + " · " +
            (relation.edge.label || "连接");
          button.addEventListener("click", function () {
            selectRelation(relation);
          });
          mobileRelations.appendChild(button);
        });
      }

      function render() {
        var view = views[state.viewId];
        var relations = relationsForView(state.viewId);
        mapTitle.textContent = view.title;
        mapKicker.textContent = view.kicker;
        mapDescription.textContent = view.description;
        diagram.style.setProperty("--rows", String(view.rows));
        renderBreadcrumbs();
        renderNodes(view, relations);
        renderSelection(view, relations);
        renderMobileRelations(relations);
        drawEdges(view, relations);
      }

      backButton.addEventListener("click", function () {
        var parent = views[state.viewId].parent;
        if (parent) {
          navigate(parent, {
            preserveRelation: shouldPreserveActiveRelation(parent)
          });
        }
      });

      homeButton.addEventListener("click", function () {
        navigate("overview", {
          preserveRelation: shouldPreserveActiveRelation("overview")
        });
      });

      window.addEventListener("resize", function () {
        drawEdges(views[state.viewId], relationsForView(state.viewId));
      });
      window.addEventListener("hashchange", function () {
        var requested = location.hash.slice(1);
        if (views[requested] && requested !== state.viewId) {
          state.viewId = requested;
          state.selection = null;
          state.activeRelation = null;
          render();
        }
      });

      if ("ResizeObserver" in window) {
        new ResizeObserver(function () {
          drawEdges(views[state.viewId], relationsForView(state.viewId));
        }).observe(diagram);
      }

      window.__HIERARCHICAL_MAP_AUDIT__ = Object.freeze({
        viewIds: Object.freeze(Object.keys(views))
      });
      render();
    })();
  </script>
</body>
</html>
